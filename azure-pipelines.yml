name: Deploy Bicep files

trigger:
 branches:
   include:
     - master
 paths:
   include:
     - infra/*

parameters:
- name: azureServiceConnection
  type: string
  default: 'plscont'


pool:
  vmImage: ubuntu-latest


variables:
- group: AutomationDemo

steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: '${{ parameters.azureServiceConnection }}'
    scriptType: bash
    scriptLocation: inlineScript
    useGlobalConfig: false
    inlineScript: |
      az --version
      az deployment sub create `
        --parameters ./infra/main.parameters.json vmPassword=$(vmPassword) `
        --template-file ./infra/main.bicep
  

