apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: crudapi-provider-class
  namespace: crudapp
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "d86a325e-ab54-4e00-a2e2-e98aeeea2276"
    keyvaultName: "kv-ndsujuqs6n6hk"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: "DB-HOST"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "DB-USER"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "DB-PASSWORD"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "DB-NAME"
          objectType: secret
          objectVersion: ""
    tenantId: "0b60fed4-5fc9-409d-95f2-271114f4c86f"
  secretObjects:
    - data:
        - objectName: "DB-HOST"
          key: "DB_HOST"
        - objectName: "DB-USER"
          key: "DB_USER"
        - objectName: "DB-PASSWORD" 
          key: "DB_PASSWORD"
        - objectName: "DB-NAME"
          key: "DB_DATABASE"
      secretName: crudapi-secret
      type: Opaque