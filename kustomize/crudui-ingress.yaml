apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  name: crudui-ingress
  namespace: crudapp
  # annotations:
    # appgw.ingress.kubernetes.io/backend-path-prefix: "/"
spec:
  ingressClassName: azure-application-gateway
  rules:
  - http:
      paths:
      - backend:
          service:
            name: crudui
            port:
              number: 80
        path: /
        pathType: Prefix

status:
  loadBalancer: {}
