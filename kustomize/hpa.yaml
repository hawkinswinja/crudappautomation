apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crudapi
  namespace: crudapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crudapi
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            selectPolicy: Max
            policies:
            - type: Pods
              value: 3
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            selectPolicy: Min
            policies:
            - type: Pods
              value: 1
              periodSeconds: 60
            - type: Percent
              value: 50
              periodSeconds: 60