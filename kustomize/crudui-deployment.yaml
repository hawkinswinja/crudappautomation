apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: crudui
  name: crudui
  namespace: crudapp
spec:
  selector:
    matchLabels:
      app: crudui
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: crudui
    spec:
      volumes:
      - name: nginx
        configMap:
          name: nginx-conf
      containers:
      - image: automationdemo.azurecr.io/crudui:202505121217 # {"$imagepolicy": "flux-system:crudui-image-policy"}
        name: crudui
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 100Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 20
          initialDelaySeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx
          subPath: nginx.conf
status: {}
