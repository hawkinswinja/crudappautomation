apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: crudapi
  name: crudapi
  namespace: crudapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crudapi
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: crudapi
    spec:
      volumes:
      - name: crudapi-volume
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: crudapi-provider-class
      containers:
      - image: automationdemo.azurecr.io/crudapi:202505121204 # {"$imagepolicy": "flux-system:crudapi-image-policy"}
        name: crudapi
        # envFrom:
        # - secretKeyRef:
        #     name: crudapi-secret
        livenessProbe:
          httpGet:
            path: /api/products
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        env:
        - name: APP_DEBUG
          value: "true"
        - name: DB_CONNECTION
          value: sqlsrv
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: crudapi-secret
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: DB_USER
              name: crudapi-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: crudapi-secret
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              key: DB_DATABASE
              name: crudapi-secret
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - mountPath: /usr/src/app
          name: crudapi-volume
status: {}
